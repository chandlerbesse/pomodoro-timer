<!DOCTYPE html>
<html lang="en">
<head> <!-- Convention is to not indent after <html> -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Pomodoro Timer</h1>

        <div class="timer-panel">

            <div class="adjustable-timer">
                <div class="time-adjuster">
                    <button type="button" id="add-minute-btn" class="stepper-btn time-adjust-btn" aria-label="Add 1 minute">&plus;</button>
                    <button type="button" id="subtract-minute-btn" class="stepper-btn time-adjust-btn" aria-label="Subtract 1 minute">&minus;</button>
                </div>

                <p id="timer" class="panel-background">25:00</p>
            </div>

            <div class="control-panel">

                <div role="group" class="mode-selector" aria-label="Mode">
                    <button type="button" id="prev-mode-btn" class="stepper-btn" aria-label="Previous mode">&lt;</button>
                    <div class="mode-display panel-background">
                        <p id="mode" aria-live="polite">Focus</p>
                        <p role="img" id="cycle-dots"></p>
                    </div>
                    <button type="button" id="next-mode-btn" class="stepper-btn" aria-label="Next mode">&gt;</button>
                </div>
                
                <div class="toolbar">
                    <button type="button" id="start-pause-btn" class="primary-btn">Start</button>
                    <button type="button" id="reset-btn" class="danger-btn">Reset</button>
                </div>
                
            </div>

        </div>

        <p id="session-message" aria-live="polite"></p>

    </main>
</body>
</html>
